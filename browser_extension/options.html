<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorkTrack Website Time</title>
    <style>
      body { max-width: 560px; margin: 40px auto; padding: 0 20px; font: 16px/1.5 system-ui, sans-serif; color: #243b35; }
      label { display: block; margin-top: 16px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; }
      button { margin-top: 18px; padding: 10px 16px; border: 0; border-radius: 8px; background: #20b99a; color: white; font-weight: 600; cursor: pointer; }
      #logout { background: #c83f4f; margin-left: 8px; }
      #status { min-height: 24px; }
      .note { background: #e8f6ef; border-radius: 8px; padding: 12px; }
    </style>
  </head>
  <body>
    <h1>WorkTrack — вэбсайт ашиглалт</h1>
    <p class="note">Зөвхөн идэвхтэй browser tab-ын домэйн болон хугацааг бүртгэнэ. URL зам, хайлтын үг, хуудасны агуулгыг цуглуулахгүй. 15 секундээс удаан idle үед хугацаа тоолохоо зогсооно. Мониторингийн зөвшөөрөл идэвхтэй байх шаардлагатай.</p>
    <label for="api">Backend API хаяг</label>
    <input id="api" type="url" value="http://127.0.0.1:8000" autocomplete="url" />
    <label for="username">Хэрэглэгчийн нэр</label>
    <input id="username" autocomplete="username" />
    <label for="password">Нууц үг</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="login">Зөвшөөрөл шалгаж нэвтрэх</button>
    <button id="logout" hidden>Гарах</button>
    <p id="status" role="status"></p>
    <script src="options.js"></script>
  </body>
</html>
