x-logging: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-app: &app
  build: ./backend
  restart: unless-stopped
  logging: *logs
  env_file: ./deploy/production.env
  environment: &environment
    POSTGRES_DB: ${POSTGRES_DB:-worker_monitor}
    POSTGRES_USER: ${POSTGRES_USER:-worker_monitor}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
    DJANGO_DEBUG: "false"
    DJANGO_ALLOWED_HOSTS: ${APP_DOMAIN:?Set APP_DOMAIN},localhost,127.0.0.1
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    CSRF_TRUSTED_ORIGINS: https://${APP_DOMAIN}
    DJANGO_SECURE_SSL_REDIRECT: "true"
    TRUST_PROXY_HEADERS: "true"
    TRUSTED_PROXY_NETWORKS: 172.30.0.2/32
    DJANGO_CACHE_BACKEND: database
    REQUIRE_MONITORING_CONSENT: "true"
    ACTIVITY_RETENTION_DAYS: ${ACTIVITY_RETENTION_DAYS:-90}
    ACTIVITY_RETENTION_AUTO: ${ACTIVITY_RETENTION_AUTO:-true}
    BACKUP_KEEP: ${BACKUP_KEEP:-7}
  networks: [internal]
  volumes:
    - backups:/app/backups
    - static:/app/staticfiles

services:
  db:
    image: postgres:17-alpine
    logging: *logs
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worker_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-worker_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    <<: *app
    expose: ["8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/health/',headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
  scheduler:
    <<: *app
    command: python -u manage.py run_score_scheduler
    depends_on:
      backend: {condition: service_healthy}
  backup:
    <<: *app
    command: python -u manage.py run_backup_scheduler
    depends_on:
      backend: {condition: service_healthy}
  proxy:
    image: caddy:2-alpine
    logging: *logs
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
        ipv4_address: 172.30.0.2
      public: {}
    depends_on:
      backend: {condition: service_healthy}
networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  public: {}
volumes:
  postgres_data:
  backups:
  static:
  caddy_data:
  caddy_config:
