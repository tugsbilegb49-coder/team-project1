name: Windows
# Proves the project installs, passes its tests and starts/stops cleanly on Windows.
# Each check is its own step so a failure names exactly what broke.
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DJANGO_CACHE_BACKEND: locmem
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-qa.txt
            requirements-ai.txt
            backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python packages
        run: python -m pip install -r requirements-qa.txt
      - name: Install Node packages
        run: npm ci
      - name: Django check
        run: python manage.py check
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Django tests
        run: python manage.py test users workforce activity scoring
      - name: Python tests
        run: python -m pytest -q
      - name: Agent tests (includes Windows API calls)
        run: python -m unittest discover -s agent -p "test*.py" -v
      - name: Alternative agent tests
        run: python -m unittest discover -s activity_agent/tests
      - name: Frontend unit tests
        run: npm test
      - name: Frontend lint
        run: npm run lint
      - name: Frontend build
        run: npm run build
      - name: Install browser
        run: npx playwright install chromium
      - name: Frontend browser tests
        run: npx playwright test e2e/frontend.spec.js
      - name: Real browser with Django
        run: python verify_frontend.py
      - name: Launcher start, agent start/stop and Ctrl+Break shutdown
        run: python verify_launcher.py --agent
