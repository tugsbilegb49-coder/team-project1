name: Camera AI and final integration QA
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_CACHE_BACKEND: locmem
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-qa.txt
            requirements-ai.txt
            backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r requirements-qa.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python verify_camera_ai.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-ai-qa-evidence
          path: .runtime/qa/
          retention-days: 14
